version: '3.8'

services:
  redis:
    image: redis/redis-stack-server:latest
    container_name: support_agent_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_support_data:/data
    restart: unless-stopped

  support_agent:
    build:
      context: .
      dockerfile: Dockerfile.support
    container_name: enterprise_ai_support_agent
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: "no"
    stdin_open: true
    tty: true

volumes:
  redis_support_data:
